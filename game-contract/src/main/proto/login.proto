syntax = "proto3";

package brick.game.contract;

option java_package = "io.github.brick.contract.game";
option java_multiple_files = true;
import "player.proto";

message LoginRequest {
  reserved 1;
  reserved "token";
  string username = 2;
  string password = 3;
}

message LoginResponse {
  bool ok = 1;
  int64 user_id = 2;
  string token = 3;
  int64 expires_at = 4;
  int64 account_id = 5;
  PlayerProfileMessage profile = 6;
}
message RegisterRequest { string username = 1; string password = 2; }
message RegisterResponse { int64 account_id = 1; }
message LogoutRequest {}
message LogoutResponse { bool ok = 1; }
