syntax = "proto3";
package brick.game.contract;
option java_package = "io.github.brick.contract.game";
option java_multiple_files = true;
message PlayerProfileMessage {
  int64 uid = 1;
  int64 account_id = 2;
  string display_name = 3;
  int64 created_at = 4;
  int64 updated_at = 5;
}
message ProfileRequest {}
message RenameRequest { string display_name = 1; }
message ProfileResponse { PlayerProfileMessage profile = 1; }
